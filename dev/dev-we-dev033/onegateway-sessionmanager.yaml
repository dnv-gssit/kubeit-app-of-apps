---
deploy:
  initContainers:
    - name: wait-for-redis
      image: kubeitglobalsvcauxacrwe.azurecr.io/owncloudci/wait-for
      args:
        - "-it"
        - "sm-redis-master:6379"
        - "-t"
        - "30"
      resources:
        requests:
          cpu: "5m"
          memory: "32Mi"
        limits:
          memory: "128Mi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
  gateway:
    name: istio-system/global-https-external-default-gateway

  serviceAccount:
    enabled: true
    annotations:
      azure.workload.identity/tenant-id: adf10e2b-b6e9-41d6-be2f-c12bb566019c
      azure.workload.identity/client-id: 8e8c8d25-ccbe-4c50-a864-e0dc2046d46e

  app: onegateway-sessionmanager
  appVersion: v1

  sessionManager:
    name: sm-onegateway

  defaultRouting:
    hosts:
      - ancris3-test.dev033.kubeit.dnv.com

  envsFrom:
    - name: CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: ancris3-session-manager
          key: client-secret
    - name: CLIENT_ID
      value: 1127167f-0330-447d-9744-586987c22603

  secretStore:
    vaultUrl: "https://kubeit-dev-kv-sh-we.vault.azure.net/"

  externalSecrets:
    - name: ancris3-session-manager
      refs:
        - keyName: client-secret
          kvSecretName: ancris3-session-dev033

redis:
  image:
    registry: kubeitglobalsvcauxacrwe.azurecr.io
    repository: bitnami/redis
    tag: 8.2.1-debian-12-r0
