---
deploy:
  initContainers:
    - name: wait-for-redis
      image: kubeitglobalsvcauxacrwe.azurecr.io/owncloudci/wait-for
      args:
        - "-it"
        - "sm-redis-master:6379"
        - "-t"
        - "30"
      resources:
        requests:
          cpu: "5m"
          memory: "32Mi"
        limits:
          memory: "128Mi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
  gateway:
    name: istio-system/global-https-external-default-gateway

  serviceAccount:
    enabled: true
    annotations:
      azure.workload.identity/tenant-id: adf10e2b-b6e9-41d6-be2f-c12bb566019c
      azure.workload.identity/client-id: 45fe5a01-c1dd-4b34-beb1-e38496e41c7b

  app: onegateway-sessionmanager
  appVersion: v1

  sessionManager:
    name: sm-onegateway

  defaultRouting:
    hosts:
      - <fqdn for test>

  envsFrom:
    - name: CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: ancris-session-manager
          key: client-secret
    - name: CLIENT_ID
      value: <app client id>

  secretStore:
    vaultUrl: "https://kubeit-dev-kv-sh-we.vault.azure.net/"

  externalSecrets:
    - name: ancris-session-manager
      refs:
        - keyName: client-secret
          kvSecretName: <kv-secret-name>

redis:
  image:
    registry: kubeitglobalsvcauxacrwe.azurecr.io
    repository: bitnami/redis
    tag: 8.2.1-debian-12-r0
