---
app: standard-workload
appVersion: v1


defaultRouting:
  annotations:
    f5xc/regions: sea
image:
  name: "kubeitglobalsvcauxacrwe.azurecr.io/gcr.io/google-samples/hello-app"
  tag: "1.0"

service:
  containerPort: 8080
  port: 8080

defaultRouting:
  enabled: true
  hosts: [auto]
  retries:
    attempts: 3
    perTryTimeout: 2s
  headers:
    request:
      add:
        x-appname: standard-workload

destinationRule:
  enabled: true

authorizationPolicy:
  enabled: false

requestAuthentication:
  enabled: false

# Be Aware! Security contexts configuration is specific to Docker Image, if your workload is not spinning up try disabling settings below and after check what needs to be changed.
podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true

# readOnlyRootFilesystem should be set as a false because of the issue related to the npm directory creation
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

# https://github.com/paulbouwer/hello-kubernetes/tree/main/src/app
envs:
  - name: MESSAGE
    value: "Hello on standard-test workload on dev!"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 128Mi
